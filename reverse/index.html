<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><meta name="theme-color" content="#e93567"><meta name="description" content="欲しい利益、仕入れ値、販売手数料、送料、その他費用から必要な販売価格を逆算します。"><meta name="robots" content="index,follow"><link rel="canonical" href="https://furima-profit-calculator.netlify.app/reverse/"><link rel="stylesheet" href="/assets/css/style.css"><title>フリマ利益逆算｜欲しい利益から販売価格を計算</title><script async src="https://www.googletagmanager.com/gtag/js?id=G-9B8673RD4H"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-9B8673RD4H');</script></head><body data-page="reverse"><div id="siteHeader"></div><main class="page-shell narrow">
<section class="page-hero"><div class="page-title-row"><h1>フリマ利益逆算</h1></div><p>欲しい利益を入力すると、手数料や送料を含めて必要な販売価格を逆算します。</p></section>
<section class="card">
<div class="field"><label for="reverseMarketplace">利用するフリマ</label><select id="reverseMarketplace" class="standard-select"></select></div>
<div class="field"><label for="targetProfit">欲しい利益</label><div class="input-wrap"><input id="targetProfit" type="number" inputmode="numeric" min="0" step="1" placeholder="例：1000"><span class="unit">円</span></div></div>
<div class="field"><label for="reverseCostPrice">仕入れ値</label><div class="input-wrap"><input id="reverseCostPrice" type="number" inputmode="numeric" min="0" step="1" placeholder="例：1000"><span class="unit">円</span></div></div>
<div class="field"><label for="reverseFeeRate">販売手数料 <span class="hint">初期値10%</span></label><div class="input-wrap"><input id="reverseFeeRate" type="number" inputmode="decimal" min="0" max="99.9" step="0.1" value="10"><span class="unit">%</span></div></div>
<div class="field"><label for="reverseShippingMethod">配送方法と料金</label><select id="reverseShippingMethod" class="standard-select"></select></div>
<div class="field"><label for="reverseShippingCost">配送料 <span class="hint">その他を選んだ場合のみ手入力</span></label><div class="input-wrap"><input id="reverseShippingCost" type="number" inputmode="numeric" min="0" step="1" value="0" disabled><span class="unit">円</span></div></div>
<div class="field"><label for="reverseOtherCost">その他費用 <span class="hint">箱代・梱包材など</span></label><div class="input-wrap"><input id="reverseOtherCost" type="number" inputmode="numeric" min="0" step="1" value="0"><span class="unit">円</span></div></div>
</section>
<section class="card result"><div class="profit-label">必要な販売価格</div><div id="requiredSalePrice" class="profit reverse-result">0円</div><div class="breakdown"><div class="row"><span>販売手数料</span><strong id="reverseFeeAmount">0円</strong></div><div class="row"><span>想定利益</span><strong id="reverseActualProfit">0円</strong></div></div></section>
<button id="reverseResetButton" class="reset" type="button">入力をリセット</button><section class="ad" aria-label="広告"><div>広告<small>AdSense承認後に表示されます</small></div></section>
</main><div id="siteFooter"></div><script src="/assets/js/shipping-data.js"></script><script src="/assets/js/reverse.js"></script><script src="/assets/js/common.js"></script></body></html>
